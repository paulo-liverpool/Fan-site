<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Escolhe o teu clube | Barça Real</title>

    <link rel="stylesheet" href="css/global.css">

    <style>
        /* ========================================================
           CHOOSE TEAM
           ======================================================== */

        body {
            background: #08090c;
            overflow-x: hidden;
        }

        .team-page {
            min-height: 100vh;

            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px 20px;

            overflow: hidden;
        }


        /* ========================================================
           BACKGROUND
           ======================================================== */

        .team-page::before {
            content: "";

            position: absolute;

            width: 500px;
            height: 500px;

            left: -220px;
            top: -180px;

            border-radius: 50%;

            background: rgba(165, 0, 68, 0.16);

            filter: blur(100px);
        }

        .team-page::after {
            content: "";

            position: absolute;

            width: 500px;
            height: 500px;

            right: -220px;
            bottom: -180px;

            border-radius: 50%;

            background: rgba(0, 82, 204, 0.14);

            filter: blur(100px);
        }


        /* ========================================================
           CONTAINER
           ======================================================== */

        .team-container {
            position: relative;
            z-index: 2;

            width: min(100%, 850px);

            text-align: center;
        }


        /* ========================================================
           BRAND
           ======================================================== */

        .team-brand {
            margin-bottom: 45px;
        }

        .team-brand-logo {
            width: 58px;
            height: 58px;

            margin: 0 auto 18px;

            border: 2px solid white;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 17px;
            font-weight: 900;

            letter-spacing: -2px;
        }

        .team-brand h1 {
            font-size: 22px;

            font-weight: 900;

            letter-spacing: 4px;
        }

        .team-brand p {
            margin-top: 10px;

            color: rgba(255,255,255,0.45);

            font-size: 13px;
        }


        /* ========================================================
           TITLE
           ======================================================== */

        .team-heading {
            margin-bottom: 30px;
        }

        .team-heading h2 {
            font-size: clamp(30px, 6vw, 46px);

            font-weight: 900;

            letter-spacing: -1.5px;
        }

        .team-heading p {
            margin-top: 10px;

            font-size: 13px;

            color: rgba(255,255,255,0.45);
        }


        /* ========================================================
           TEAM CARDS
           ======================================================== */

        .team-options {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 18px;
        }

        .team-card {
            min-height: 300px;

            position: relative;

            overflow: hidden;

            border: 1px solid rgba(255,255,255,0.09);

            border-radius: 22px;

            background: rgba(255,255,255,0.035);

            color: white;

            text-align: left;

            transition:
                transform 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease;
        }

        .team-card:hover {
            transform: translateY(-5px);

            border-color: rgba(255,255,255,0.22);
        }

        .team-card:active {
            transform: scale(0.98);
        }


        /* ========================================================
           CARD BACKGROUNDS
           ======================================================== */

        .team-card.barcelona {
            background:
                radial-gradient(
                    circle at 85% 20%,
                    rgba(165,0,68,0.4),
                    transparent 45%
                ),
                linear-gradient(
                    145deg,
                    #10131d,
                    #08090c
                );
        }

        .team-card.madrid {
            background:
                radial-gradient(
                    circle at 85% 20%,
                    rgba(255,204,0,0.25),
                    transparent 45%
                ),
                linear-gradient(
                    145deg,
                    #15151a,
                    #08090c
                );
        }


        /* ========================================================
           CREST
           ======================================================== */

        .team-crest {
            width: 82px;
            height: 82px;

            position: absolute;

            top: 28px;
            right: 28px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 18px;

            font-weight: 900;

            background: rgba(255,255,255,0.07);

            border: 1px solid rgba(255,255,255,0.13);
        }

        .barcelona .team-crest {
            box-shadow:
                0 0 45px rgba(165,0,68,0.35);
        }

        .madrid .team-crest {
            box-shadow:
                0 0 45px rgba(255,204,0,0.25);
        }


        /* ========================================================
           CARD CONTENT
           ======================================================== */

        .team-card-content {
            position: absolute;

            left: 25px;
            right: 25px;
            bottom: 25px;
        }

        .team-card-content small {
            display: block;

            margin-bottom: 8px;

            font-size: 10px;

            letter-spacing: 2px;

            font-weight: 800;

            color: rgba(255,255,255,0.4);
        }

        .team-card-content h3 {
            font-size: 25px;

            font-weight: 900;

            letter-spacing: -0.7px;
        }

        .team-card-content span {
            display: block;

            margin-top: 7px;

            font-size: 12px;

            color: rgba(255,255,255,0.45);
        }


        /* ========================================================
           FOOTER
           ======================================================== */

        .team-footer {
            margin-top: 25px;

            font-size: 10px;

            color: rgba(255,255,255,0.28);
        }


        /* ========================================================
           MOBILE
           ======================================================== */

        @media (max-width: 600px) {

            .team-page {
                padding: 30px 16px;
            }

            .team-brand {
                margin-bottom: 35px;
            }

            .team-options {
                grid-template-columns: 1fr;

                gap: 14px;
            }

            .team-card {
                min-height: 220px;
            }

            .team-crest {
                width: 68px;
                height: 68px;

                top: 22px;
                right: 22px;
            }

            .team-card-content {
                left: 21px;
                bottom: 21px;
            }
        }
    </style>
</head>

<body>

<main class="team-page">

    <div class="team-container">


        <!-- ====================================================
             BRAND
             ==================================================== -->

        <div class="team-brand">

            <div class="team-brand-logo">
                BR
            </div>

            <h1>
                BARÇA REAL
            </h1>

            <p>
                O teu futebol. O teu lado. A tua comunidade.
            </p>

        </div>


        <!-- ====================================================
             HEADING
             ==================================================== -->

        <div class="team-heading">

            <h2>
                Escolhe o teu clube
            </h2>

            <p>
                A tua escolha vai personalizar a tua experiência
                no Barça Real.
            </p>

        </div>


        <!-- ====================================================
             TEAM OPTIONS
             ==================================================== -->

        <div class="team-options">


            <!-- BARCELONA -->

            <button
                class="team-card barcelona"
                id="barcelona-card"
                data-team="barcelona"
                onclick="selectTeam('barcelona', this)"
            >

                <div class="team-crest">
                    FCB
                </div>

                <div class="team-card-content">

                    <small>
                        LA LIGA
                    </small>

                    <h3>
                        FC Barcelona
                    </h3>

                    <span>
                        Visca Barça
                    </span>

                </div>

            </button>


            <!-- REAL MADRID -->

            <button
                class="team-card madrid"
                id="madrid-card"
                data-team="real-madrid"
                onclick="selectTeam('real-madrid', this)"
            >

                <div class="team-crest">
                    RMA
                </div>

                <div class="team-card-content">

                    <small>
                        LA LIGA
                    </small>

                    <h3>
                        Real Madrid
                    </h3>

                    <span>
                        Hala Madrid
                    </span>

                </div>

            </button>

        </div>


        <div class="team-footer">
            Podes alterar a tua preferência mais tarde.
        </div>

    </div>

</main>


<!-- ============================================================
     SUPABASE
     ============================================================ -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>


<script>

    // ============================================================
    // GET CURRENT USER
    // ============================================================

    async function getCurrentUser() {

        const {
            data: {
                user
            }
        } = await supabaseClient.auth.getUser();


        if (!user) {

            window.location.href =
                "login.html";

            return null;
        }


        return user;
    }


    // ============================================================
    // SELECT TEAM
    // ============================================================

    async function selectTeam(teamSlug, card) {

        const user =
            await getCurrentUser();


        if (!user) {
            return;
        }


        // --------------------------------------------------------
        // Prevent multiple clicks
        // --------------------------------------------------------

        card.disabled = true;

        card.style.opacity = "0.6";


        // --------------------------------------------------------
        // Find team
        // --------------------------------------------------------

        const {
            data: team,
            error: teamError
        } = await supabaseClient
            .from("teams")
            .select("id")
            .eq("slug", teamSlug)
            .eq("is_active", true)
            .single();


        if (teamError || !team) {

            card.disabled = false;

            card.style.opacity = "1";

            alert(
                "Não foi possível encontrar este clube."
            );

            return;
        }


        // --------------------------------------------------------
        // Save preference
        // --------------------------------------------------------

        const {
            error
        } = await supabaseClient
            .from("profiles")
            .update({
                supported_team_id: team.id
            })
            .eq("id", user.id);


        if (error) {

            card.disabled = false;

            card.style.opacity = "1";

            alert(
                "Não foi possível guardar a tua escolha."
            );

            return;
        }


        // --------------------------------------------------------
        // Continue
        // --------------------------------------------------------

        window.location.href =
            "loading.html?team=" +
            encodeURIComponent(teamSlug);
    }


    // ============================================================
    // VERIFY USER
    // ============================================================

    getCurrentUser();

</script>

</body>
</html>
