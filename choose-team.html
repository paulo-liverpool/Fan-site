<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Choose Your Side | Barça Real</title>

    <link rel="stylesheet" href="css/global.css">

    <style>

        /* =====================================================
           CHOOSE TEAM
           ===================================================== */

        body {
            min-height: 100vh;
            overflow-x: hidden;
            background: #09090b;
        }

        .team-page {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 20px;

            position: relative;
            overflow: hidden;
        }


        /* =====================================================
           BACKGROUND
           ===================================================== */

        .background-glow {
            position: absolute;

            width: 500px;
            height: 500px;

            border-radius: 50%;

            filter: blur(120px);

            opacity: 0.15;

            pointer-events: none;
        }

        .glow-barca {
            background: #a50044;

            top: -250px;
            left: -200px;
        }

        .glow-madrid {
            background: #d4af37;

            bottom: -250px;
            right: -200px;
        }


        /* =====================================================
           CONTENT
           ===================================================== */

        .team-container {
            width: 100%;
            max-width: 1050px;

            position: relative;
            z-index: 2;

            text-align: center;
        }

        .brand-small {
            font-size: 12px;
            font-weight: 800;

            letter-spacing: 4px;

            color: #a1a1aa;

            margin-bottom: 25px;
        }

        .team-container h1 {
            font-size: clamp(34px, 6vw, 58px);

            line-height: 1;

            font-weight: 900;

            letter-spacing: -2px;
        }

        .team-subtitle {
            margin: 15px auto 42px;

            max-width: 500px;

            color: #a1a1aa;

            font-size: 15px;

            line-height: 1.6;
        }


        /* =====================================================
           TEAM CARDS
           ===================================================== */

        .team-options {
            display: grid;

            grid-template-columns: repeat(2, minmax(0, 1fr));

            gap: 20px;

            max-width: 850px;

            margin: 0 auto;
        }

        .team-card {
            min-height: 330px;

            border: 1px solid rgba(255,255,255,0.10);

            border-radius: 26px;

            padding: 35px 30px;

            background: rgba(24,24,27,0.78);

            position: relative;

            overflow: hidden;

            cursor: pointer;

            text-align: center;

            transition:
                transform 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease;
        }

        .team-card:hover {
            transform: translateY(-6px);
        }


        /* =====================================================
           BARÇA CARD
           ===================================================== */

        .barca-card {
            background:
                linear-gradient(
                    145deg,
                    rgba(165,0,68,0.24),
                    rgba(0,77,152,0.18)
                ),
                #111113;
        }

        .barca-card:hover {
            border-color: rgba(165,0,68,0.65);

            box-shadow:
                0 20px 60px rgba(165,0,68,0.18);
        }


        /* =====================================================
           MADRID CARD
           ===================================================== */

        .madrid-card {
            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.10),
                    rgba(212,175,55,0.08)
                ),
                #111113;
        }

        .madrid-card:hover {
            border-color: rgba(212,175,55,0.55);

            box-shadow:
                0 20px 60px rgba(212,175,55,0.12);
        }


        /* =====================================================
           CREST PLACEHOLDER
           ===================================================== */

        .team-crest {
            width: 105px;
            height: 105px;

            margin: 0 auto 24px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 23px;
            font-weight: 900;

            background: rgba(255,255,255,0.06);

            border: 1px solid rgba(255,255,255,0.12);

            transition: transform 0.3s ease;
        }

        .team-card:hover .team-crest {
            transform: scale(1.06);
        }

        .barca-crest {
            border-color: rgba(165,0,68,0.5);

            background:
                linear-gradient(
                    135deg,
                    #a50044,
                    #004d98
                );
        }

        .madrid-crest {
            background:
                linear-gradient(
                    135deg,
                    #f4f4f5,
                    #d4af37
                );

            color: #18181b;
        }


        /* =====================================================
           TEAM TEXT
           ===================================================== */

        .team-name {
            font-size: 25px;

            font-weight: 900;

            margin-bottom: 8px;
        }

        .team-description {
            color: #a1a1aa;

            font-size: 13px;

            line-height: 1.5;
        }

        .team-action {
            margin-top: 25px;

            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-height: 42px;

            padding: 0 20px;

            border-radius: 10px;

            background: rgba(255,255,255,0.08);

            color: #ffffff;

            font-size: 13px;

            font-weight: 800;
        }


        /* =====================================================
           STATUS
           ===================================================== */

        .team-message {
            margin: 25px auto 0;

            min-height: 20px;

            color: #fca5a5;

            font-size: 13px;
        }


        /* =====================================================
           LOADING STATE
           ===================================================== */

        .team-card.loading {
            pointer-events: none;

            opacity: 0.65;
        }

        .team-card.loading .team-action {
            background: rgba(255,255,255,0.14);
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 700px) {

            .team-page {
                padding: 25px 15px;
            }

            .team-container h1 {
                letter-spacing: -1.5px;
            }

            .team-subtitle {
                margin-bottom: 30px;
            }

            .team-options {
                grid-template-columns: 1fr;

                max-width: 430px;

                gap: 15px;
            }

            .team-card {
                min-height: 270px;

                padding: 28px 22px;
            }

            .team-crest {
                width: 82px;
                height: 82px;

                margin-bottom: 18px;
            }

            .team-name {
                font-size: 22px;
            }
        }

    </style>
</head>

<body>

    <main class="team-page">

        <div class="background-glow glow-barca"></div>
        <div class="background-glow glow-madrid"></div>


        <div class="team-container">

            <!-- =================================================
                 HEADER
                 ================================================= -->

            <div class="brand-small">
                BARÇA REAL
            </div>

            <h1>
                Choose Your Side
            </h1>

            <p class="team-subtitle">
                Your choice shapes your Barça Real experience.
                Choose the club you support.
            </p>


            <!-- =================================================
                 TEAM OPTIONS
                 ================================================= -->

            <div class="team-options">

                <!-- =============================================
                     BARCELONA
                     ============================================= -->

                <button
                    type="button"
                    class="team-card barca-card"
                    data-team="barcelona"
                    id="barcelona-card"
                >

                    <div class="team-crest barca-crest">
                        FCB
                    </div>

                    <div class="team-name">
                        FC Barcelona
                    </div>

                    <div class="team-description">
                        More than a club.
                    </div>

                    <div class="team-action">
                        Choose Barça
                    </div>

                </button>


                <!-- =============================================
                     REAL MADRID
                     ============================================= -->

                <button
                    type="button"
                    class="team-card madrid-card"
                    data-team="real-madrid"
                    id="madrid-card"
                >

                    <div class="team-crest madrid-crest">
                        RMA
                    </div>

                    <div class="team-name">
                        Real Madrid
                    </div>

                    <div class="team-description">
                        Hala Madrid.
                    </div>

                    <div class="team-action">
                        Choose Madrid
                    </div>

                </button>

            </div>


            <div
                id="team-message"
                class="team-message"
                aria-live="polite"
            ></div>

        </div>

    </main>


    <!-- =========================================================
         SUPABASE
         ========================================================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>


    <!-- =========================================================
         TEAM SELECTION
         ========================================================= -->

    <script>

        const barcelonaCard =
            document.getElementById("barcelona-card");

        const madridCard =
            document.getElementById("madrid-card");

        const message =
            document.getElementById("team-message");


        // ======================================================
        // GET CURRENT USER
        // ======================================================

        async function getCurrentUser() {

            const {
                data: { user },
                error
            } = await supabaseClient.auth.getUser();


            if (error || !user) {

                window.location.href = "login.html";

                return null;
            }


            return user;
        }


        // ======================================================
        // SELECT TEAM
        // ======================================================

        async function selectTeam(teamSlug, card) {

            message.textContent = "";

            barcelonaCard.classList.remove("loading");
            madridCard.classList.remove("loading");

            card.classList.add("loading");


            const user =
                await getCurrentUser();


            if (!user) {
                return;
            }


            try {

                // =================================================
                // Find team in database
                // =================================================

                const {
                    data: team,
                    error: teamError
                } = await supabaseClient
                    .from("teams")
                    .select("id, name, slug")
                    .eq("slug", teamSlug)
                    .eq("is_active", true)
                    .single();


                if (teamError || !team) {

                    throw new Error(
                        "Unable to find the selected team."
                    );

                }


                // =================================================
                // Save team to profile
                // =================================================

                const {
                    error: profileError
                } = await supabaseClient
                    .from("profiles")
                    .update({
                        supported_team_id: team.id
                    })
                    .eq("id", user.id);


                if (profileError) {
                    throw profileError;
                }


                // =================================================
                // Continue to loading experience
                // =================================================

                window.location.href =
                    "loading.html?team=" +
                    encodeURIComponent(team.slug);

            } catch (error) {

                console.error(error);

                message.textContent =
                    error.message ||
                    "Something went wrong. Please try again.";

                barcelonaCard.classList.remove("loading");
                madridCard.classList.remove("loading");
            }
        }


        // ======================================================
        // EVENTS
        // ======================================================

        barcelonaCard.addEventListener(
            "click",
            function () {
                selectTeam("barcelona", barcelonaCard);
            }
        );


        madridCard.addEventListener(
            "click",
            function () {
                selectTeam("real-madrid", madridCard);
            }
        );


        // ======================================================
        // INITIAL AUTH CHECK
        // ======================================================

        getCurrentUser();

    </script>

</body>
</html>
