<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Entrar | Barça Real</title>

    <link rel="stylesheet" href="css/global.css">

    <style>
        /* ========================================================
           LOGIN
           ======================================================== */

        body {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at top,
                    #171923,
                    #08090c 55%
                );
        }

        .auth-page {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;
        }

        .auth-container {
            width: 100%;
            max-width: 430px;
        }


        /* ========================================================
           BRAND
           ======================================================== */

        .auth-brand {
            text-align: center;

            margin-bottom: 38px;
        }

        .auth-logo {
            width: 64px;
            height: 64px;

            margin: 0 auto 18px;

            border: 2px solid white;
            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 19px;
            font-weight: 900;

            letter-spacing: -2px;
        }

        .auth-brand h1 {
            font-size: 25px;
            font-weight: 900;

            letter-spacing: 3px;
        }

        .auth-brand p {
            margin-top: 9px;

            font-size: 13px;

            color: rgba(255,255,255,0.45);
        }


        /* ========================================================
           CARD
           ======================================================== */

        .auth-card {
            padding: 28px;

            border-radius: 20px;

            background: rgba(255,255,255,0.035);

            border: 1px solid rgba(255,255,255,0.08);

            box-shadow:
                0 25px 80px rgba(0,0,0,0.35);
        }


        /* ========================================================
           TABS
           ======================================================== */

        .auth-tabs {
            display: grid;

            grid-template-columns: 1fr 1fr;

            padding: 4px;

            margin-bottom: 28px;

            border-radius: 10px;

            background: rgba(255,255,255,0.05);
        }

        .auth-tab {
            border: 0;

            padding: 11px;

            border-radius: 7px;

            background: transparent;

            color: rgba(255,255,255,0.45);

            font-size: 12px;
            font-weight: 800;
        }

        .auth-tab.active {
            background: rgba(255,255,255,0.1);
            color: white;
        }


        /* ========================================================
           FORM
           ======================================================== */

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            font-size: 11px;

            font-weight: 700;

            color: rgba(255,255,255,0.55);
        }

        .form-group input {
            width: 100%;

            padding: 14px 15px;

            border: 1px solid rgba(255,255,255,0.1);

            border-radius: 10px;

            outline: none;

            background: rgba(255,255,255,0.045);

            color: white;

            font-size: 14px;
        }

        .form-group input:focus {
            border-color: rgba(255,255,255,0.3);
        }


        /* ========================================================
           BUTTON
           ======================================================== */

        .auth-submit {
            width: 100%;

            border: 0;

            padding: 14px;

            border-radius: 10px;

            background: white;

            color: #08090c;

            font-weight: 900;

            font-size: 13px;

            margin-top: 5px;
        }

        .auth-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }


        /* ========================================================
           FORGOT PASSWORD
           ======================================================== */

        .forgot-password {
            display: block;

            margin-top: 15px;

            text-align: center;

            color: rgba(255,255,255,0.45);

            font-size: 11px;

            cursor: pointer;
        }


        /* ========================================================
           MESSAGE
           ======================================================== */

        .auth-message {
            display: none;

            margin-bottom: 17px;

            padding: 11px 13px;

            border-radius: 8px;

            background: rgba(255,255,255,0.06);

            font-size: 11px;

            line-height: 1.4;
        }

        .auth-message.show {
            display: block;
        }


        /* ========================================================
           MOBILE
           ======================================================== */

        @media (max-width: 480px) {

            .auth-page {
                padding: 16px;
            }

            .auth-card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<div class="auth-page">

    <div class="auth-container">


        <!-- ====================================================
             BRAND
             ==================================================== -->

        <div class="auth-brand">

            <div class="auth-logo">
                BR
            </div>

            <h1>
                BARÇA REAL
            </h1>

            <p>
                O teu futebol. O teu lado. A tua comunidade.
            </p>

        </div>


        <!-- ====================================================
             AUTH CARD
             ==================================================== -->

        <div class="auth-card">


            <!-- TABS -->

            <div class="auth-tabs">

                <button
                    class="auth-tab active"
                    id="login-tab"
                    onclick="showLogin()"
                >
                    Entrar
                </button>

                <button
                    class="auth-tab"
                    id="signup-tab"
                    onclick="showSignup()"
                >
                    Criar conta
                </button>

            </div>


            <!-- MESSAGE -->

            <div
                class="auth-message"
                id="auth-message"
            ></div>


            <!-- FORM -->

            <form id="auth-form">


                <!-- NOME -->

                <div
                    class="form-group"
                    id="name-group"
                    style="display:none;"
                >

                    <label for="display-name">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="display-name"
                        placeholder="O teu nome"
                        autocomplete="name"
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="o-teu@email.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Palavra-passe
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="A tua palavra-passe"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-submit"
                    id="submit-button"
                >
                    Entrar
                </button>


            </form>


            <span
                class="forgot-password"
                id="forgot-password"
                onclick="resetPassword()"
            >
                Esqueceste-te da palavra-passe?
            </span>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>


<script>

    // ============================================================
    // STATE
    // ============================================================

    let authMode = "login";


    // ============================================================
    // ELEMENTS
    // ============================================================

    const authForm =
        document.getElementById("auth-form");

    const nameGroup =
        document.getElementById("name-group");

    const displayName =
        document.getElementById("display-name");

    const email =
        document.getElementById("email");

    const password =
        document.getElementById("password");

    const submitButton =
        document.getElementById("submit-button");

    const message =
        document.getElementById("auth-message");

    const loginTab =
        document.getElementById("login-tab");

    const signupTab =
        document.getElementById("signup-tab");

    const forgotPassword =
        document.getElementById("forgot-password");


    // ============================================================
    // SHOW LOGIN
    // ============================================================

    function showLogin() {

        authMode = "login";

        nameGroup.style.display = "none";

        displayName.required = false;

        loginTab.classList.add("active");
        signupTab.classList.remove("active");

        submitButton.textContent = "Entrar";

        forgotPassword.style.display = "block";

        clearMessage();
    }


    // ============================================================
    // SHOW SIGNUP
    // ============================================================

    function showSignup() {

        authMode = "signup";

        nameGroup.style.display = "block";

        displayName.required = true;

        signupTab.classList.add("active");
        loginTab.classList.remove("active");

        submitButton.textContent = "Criar conta";

        forgotPassword.style.display = "none";

        clearMessage();
    }


    // ============================================================
    // MESSAGE
    // ============================================================

    function showMessage(text) {

        message.textContent = text;

        message.classList.add("show");
    }


    function clearMessage() {

        message.textContent = "";

        message.classList.remove("show");
    }


    // ============================================================
    // AUTH
    // ============================================================

    authForm.addEventListener("submit", async function(event) {

        event.preventDefault();

        clearMessage();

        submitButton.disabled = true;


        try {

            if (authMode === "signup") {

                const {
                    data,
                    error
                } = await supabaseClient.auth.signUp({

                    email: email.value.trim(),

                    password: password.value,

                    options: {
                        data: {
                            display_name:
                                displayName.value.trim()
                        }
                    }

                });


                if (error) {
                    throw error;
                }


                if (data.session) {

                    window.location.href =
                        "choose-team.html";

                    return;

                }


                showMessage(
                    "Conta criada. Verifica o teu email para confirmar a conta."
                );

            } else {

                const {
                    data,
                    error
                } = await supabaseClient.auth
                    .signInWithPassword({

                        email:
                            email.value.trim(),

                        password:
                            password.value

                    });


                if (error) {
                    throw error;
                }


                const user =
                    data.user;


                const {
                    data: profile
                } = await supabaseClient
                    .from("profiles")
                    .select("supported_team_id")
                    .eq("id", user.id)
                    .single();


                if (
                    !profile ||
                    !profile.supported_team_id
                ) {

                    window.location.href =
                        "choose-team.html";

                } else {

                    window.location.href =
                        "home.html";

                }

            }

        } catch (error) {

            showMessage(
                error.message ||
                "Ocorreu um erro. Tenta novamente."
            );

        } finally {

            submitButton.disabled = false;

        }

    });


    // ============================================================
    // RESET PASSWORD
    // ============================================================

    async function resetPassword() {

        const userEmail =
            email.value.trim();


        if (!userEmail) {

            showMessage(
                "Introduz primeiro o teu email."
            );

            email.focus();

            return;
        }


        const {
            error
        } = await supabaseClient.auth
            .resetPasswordForEmail(
                userEmail,
                {
                    redirectTo:
                        window.location.origin +
                        "/reset-password.html"
                }
            );


        if (error) {

            showMessage(
                error.message
            );

            return;
        }


        showMessage(
            "Enviámos um link para redefinir a tua palavra-passe."
        );
    }

</script>

</body>
</html>
