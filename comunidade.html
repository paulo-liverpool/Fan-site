<!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Comunidade | Barça Real</title>

    <link
        rel="stylesheet"
        href="css/global.css"
    >

    <link
        rel="stylesheet"
        href="css/comunidade.css"
    >

</head>


<body>

<div class="community-page">


    <!-- ========================================================
         TOPBAR
         ======================================================== -->

    <header class="community-topbar">

        <button
            id="community-back"
            class="community-back"
            type="button"
            aria-label="Voltar"
        >
            ←
        </button>


        <div class="community-heading">

            <span class="community-title">
                Comunidade
            </span>

            <span
                id="community-unread-count"
                class="community-unread-count"
                hidden
            >
                0
            </span>

        </div>


        <button
            id="community-mark-read"
            class="community-read-button"
            type="button"
        >
            Marcar lidas
        </button>

    </header>


    <!-- ========================================================
         MAIN
         ======================================================== -->

    <main class="community-content">


        <!-- ====================================================
             ATIVIDADE
             ==================================================== -->

        <section class="community-section">

            <div class="community-section-header">

                <div>

                    <span class="community-section-label">
                        ATIVIDADE
                    </span>

                    <h2>
                        Notificações
                    </h2>

                </div>

            </div>


            <div
                id="community-notifications"
                class="community-notifications"
            >

                <div class="community-loading">
                    A carregar notificações...
                </div>

            </div>

        </section>


        <!-- ====================================================
             MINHA ATIVIDADE
             ==================================================== -->

        <section class="community-section">

            <div class="community-section-header">

                <div>

                    <span class="community-section-label">
                        A TUA ATIVIDADE
                    </span>

                    <h2>
                        Os meus comentários
                    </h2>

                </div>

                <span
                    id="my-comments-count"
                    class="community-section-count"
                >
                    0
                </span>

            </div>


            <div
                id="community-my-comments"
                class="community-my-comments"
            >

                <div class="community-loading">
                    A carregar os teus comentários...
                </div>

            </div>

        </section>


        <!-- ====================================================
             PESSOAS FAVORITAS
             ==================================================== -->

        <section class="community-section">

            <div class="community-section-header">

                <div>

                    <span class="community-section-label">
                        PESSOAS
                    </span>

                    <h2>
                        Pessoas favoritas
                    </h2>

                </div>

                <button
                    id="find-people-button"
                    class="community-text-button"
                    type="button"
                >
                    Encontrar pessoas
                </button>

            </div>


            <div
                id="favorite-people"
                class="favorite-people"
            >

                <div class="community-loading">
                    A carregar...
                </div>

            </div>

        </section>


        <!-- ====================================================
             CONVERSAS
             ==================================================== -->

        <section class="community-section">

            <div class="community-section-header">

                <div>

                    <span class="community-section-label">
                        CONVERSAS
                    </span>

                    <h2>
                        Conversas recentes
                    </h2>

                </div>

            </div>


            <div
                id="community-conversations"
                class="community-conversations"
            >

                <div class="community-loading">
                    A carregar conversas...
                </div>

            </div>

        </section>


        <!-- ====================================================
             MENSAGENS
             ==================================================== -->

        <section class="community-section">

            <div class="community-section-header">

                <div>

                    <span class="community-section-label">
                        PRIVADO
                    </span>

                    <h2>
                        Mensagens
                    </h2>

                </div>

            </div>


            <div
                id="community-messages"
                class="community-messages"
            >

                <div class="community-loading">
                    A carregar mensagens...
                </div>

            </div>

        </section>


    </main>


    <!-- ========================================================
         BOTTOM NAV
         ======================================================== -->

    <nav class="bottom-nav">


        <button
            class="nav-item"
            id="home-nav"
            type="button"
        >

            <span class="nav-icon">
                ⌂
            </span>

            <span>
                Início
            </span>

        </button>


        <button
            class="nav-item active"
            id="community-nav"
            type="button"
        >

            <span class="nav-icon fan-nav-icon-wrap">

                ◉

                <span
                    id="fan-notification-badge"
                    class="fan-notification-badge"
                    hidden
                >
                    0
                </span>

            </span>

            <span>
                Comunidade
            </span>

        </button>


        <button
            class="nav-item"
            id="matches-nav"
            type="button"
        >

            <span class="nav-icon">
                ⚽
            </span>

            <span>
                Jogos
            </span>

        </button>


        <button
            class="nav-item"
            id="profile-nav"
            type="button"
        >

            <span class="nav-icon">
                ●
            </span>

            <span>
                Perfil
            </span>

        </button>


    </nav>


</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/comunidade.js"></script>

</body>

</html>
